# CountKit configuration. Copied to config.yaml on first boot; edit that copy
# (in the UI or by hand) — this file stays as the reference.

# Verified footage from FieldKit's nvr_pull: <ingest_root>/<date>/<site>/<cam>/*.mkv
# On the Jetson this is /data/ingest.
ingest_root: ./ingest

# CountKit's own state: SQLite event DBs, calibrations, evidence crops, reports.
data_root: ./data

# UTC+2, no DST. All bins are clock quarters in this zone.
site_tz: Africa/Lusaka

# Model label -> report class. The detector's taxonomy changes (TrafficCamNet now,
# a fine-tuned model later); this table absorbs that without a code change.
# The report classes are the JICA TOR scheme. The pre-TOR labels were car, minibus, bus,
# light_truck, heavy_truck, motorcycle, bicycle — an older fine-tune emitting those needs
# its rows re-pointed here, not a code change.
# goods_vehicle is the review queue — refine each crop to lgv / mgv / hgv_mineral /
# hgv_non_mineral in Counts → Refine classes.
# Unrecognized detector labels report as 'unmapped' and surface in QA — 'other' is a
# real, measured category (the TOR's own "Others (e.g., motorcycles)").
classes:
  - {model: car, report: passenger_car}
  - {model: minibus, report: minibus_medium_bus}
  # Lusaka: 46 of 50 labelled 'bus' crops were Hiace minibuses or Coaster-type
  # medium buses, which the TOR folds into ONE class — so the majority mapping is
  # minibus_medium_bus, not large_bus. The ~8% genuine coaches are refined by hand
  # in Counts -> Refine classes. Re-measure this ratio at a long-distance terminus.
  - {model: bus, report: minibus_medium_bus}
  - {model: truck, report: goods_vehicle}
  - {model: heavy_truck, report: hgv_non_mineral}
  - {model: motorcycle, report: other}
  - {model: bicycle, report: other}
  # COCO labels, as emitted by a stock YOLO model (car/truck/motorcycle/bicycle
  # already appear above and need no second row):
  - {model: person, report: pedestrian}   # not a vehicle: counted, excluded from vehicle tables

# Passenger-car-unit factors per report class, applied only when the PCU toggle is on.
# Every report class the deliverable can name belongs here, including the refined ones
# no detector emits — the UI reads these keys for its refine buttons.
pcu:
  passenger_car: 1.0
  minibus_medium_bus: 1.5
  large_bus: 2.5
  goods_vehicle: 1.5
  lgv: 1.5
  mgv: 2.0
  hgv_mineral: 3.0
  hgv_non_mineral: 3.0
  other: 0.5
  unmapped: 1.0        # a label this table does not name still moves; count it as a car
  pedestrian: 0.0

# Classes a reviewer may refine a crop into. Default = the pcu keys plus every classes
# report value; set this only to narrow or reorder the buttons.
# refine_targets: [lgv, mgv, hgv_mineral, hgv_non_mineral]

# Which detector backend runs the analysis:
#   mock       replay fixtures — no GPU, no footage decoded
#   yolo       OpenCV decode + an ultralytics model; any CUDA box, or a CPU slowly
#   deepstream nvinfer + nvdcf on a Jetson with JetPack (needs nvinfer_config)
# Absent = the legacy behaviour: nvinfer_config set picks deepstream, empty picks mock.
# A backend that is named but unavailable is an error, never a quiet swap to another.
detector: ""

# DeepStream nvinfer config file. The model is configuration, not code — the same
# CountKit runs on the RTX rig by pointing this elsewhere. Empty = mock detector.
nvinfer_config: ""

# Settings for detector: deepstream — nvinfer_config points at an nvinfer file.
# The yolo11 route (COCO taxonomy preserved, counts comparable with the yolo
# backend): copy docker/config_infer_yolo11.txt plus the exported yolo11s.onnx
# and labels.txt into data/models/yolo11-ds/, then:
# nvinfer_config: ./data/models/yolo11-ds/config_infer_yolo11.txt
# First DeepStream run builds the TensorRT engine there (>10 min on an Orin).

# Settings for detector: yolo. Ignored by the other backends.
yolo:
  # Ultralytics weights: a bundled name auto-downloads on first run, or a path to
  # your own fine-tune. COCO labels (car, bus, truck, motorcycle, bicycle) reach the
  # report through the classes table above.
  # A bare name downloads once into <data_root>/models/, so it survives a container
  # recreate; a path (./ or /) is used as given and downloads nothing.
  model: yolo11s.pt
  # Infer on every Nth decoded frame. 3 is ~10fps of a 30fps camera — enough for a
  # crossing, a third of the GPU. Raise it if the box falls behind real time.
  stride: 3
  # Inference resolution. 960 keeps distant motorcycles; 640 is faster and blinder.
  imgsz: 960
  # Detection confidence floor. Below ~0.25 the tracker starts inventing vehicles.
  conf: 0.3

# Licensed floating-car dataset for corroboration only (never a second count).
# provider e.g. tomtom; dataset is a path under data_root. Empty = no probe UI anywhere.
# The CSV is what a TomTom Traffic Stats export / the Stage-0 poller produces:
#   site,arm,bin_start_iso,delay_s,speed_kmh,sample_n
#   gerlache,Great East Rd,2026-08-04T07:00:00+02:00,42.5,18.3,14
# sample_n travels with every figure — a delay built on 3 vehicles must look that thin.
probe:
  provider: ""
  dataset: ""

# Cloudflare R2 offload for evidence crops. Credentials live here, never in the UI.
# Local copies are deleted only after a verified upload and only under disk pressure.
r2:
  enabled: false
  account_id: ""
  access_key_id: ""
  secret_access_key: ""
  bucket: countkit-crops
  # Disk floor in GB. Above it, verified crops are uploaded and the local copy is KEPT
  # (the UI reads it instantly). Only below it does a verified upload also delete
  # locally, oldest first, and only until the drive is back above the floor.
  min_free_gb: 20
  # Public CDN base for offloaded crops, e.g. https://crops.example.com. When a crop
  # is gone locally, /api/crop redirects here and the UI labels it "from CDN".
  cdn_base: ""

# Live, attributed, unstored sanity glance only — Google data is never stored.
google_routes:
  api_key: ""

# Corridor congestion map at /corridor. Needs google_routes.api_key AND enabled: true;
# without both, the page says "not configured" and no Google request is ever made.
# road: the corridor centreline, in order — one map segment per adjacent pair.
# junctions: i indexes into road; set site to link a surveyed junction to its counts.
corridor:
  enabled: false
  road:
    - [-15.3906, 28.3228]      # Great East Rd at Manda Hill
    - [-15.3939, 28.3300]      # Arcades
    - [-15.3960, 28.3390]      # Crossroads
    - [-15.3990, 28.3500]      # Kalingalinga
  cross:
    - {name: Church Rd, pts: [[-15.3925, 28.3270], [-15.3955, 28.3245]]}
    - {name: Addis Ababa Dr, pts: [[-15.3945, 28.3345], [-15.3975, 28.3320]]}
  junctions:
    - {i: 1, name: Arcades, site: gerlache}
    - {i: 2, name: Crossroads, site: ""}

# Stamped on Excel/PDF deliverables. logo_path is relative to data_root.
branding:
  company_name: Dexterity
  logo_path: ""

# Local vision-model batches (Counts -> queue kinds vlm / vlmpair). LOCAL endpoints
# only: evidence crops carry readable plates — Zambia DPA internal QA material that
# never goes to a hosted API. Absent or empty = the feature is off everywhere.
# endpoints takes a list to shard one batch across several machines' servers.
# vlm:
#   endpoint: http://localhost:11434      # Ollama; or endpoints: [url, url]
#   model: gemma4:12b                     # e2b/e4b have an open image-input bug

# Vehicle re-ID embeddings (queue kind emb): an ONNX model trained for vehicle
# re-identification (VeRi-776 class). Threshold and margin are CALIBRATED from each
# site-day's own tracker labels at batch time, never configured.
# emb:
#   model_path: ./data/models/veri-r50.onnx
